<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Thanks for stopping by. Let's build something reliable together." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#0f2038"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#9fb3d1" stroke-opacity=".06"/></pattern>
<clipPath id="c"><rect width="1000" height="180" rx="16"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
.a{animation:s 16s linear infinite} .b{animation:s 10s linear infinite}
@keyframes s{to{transform:translateX(-500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="1000" height="180" fill="url(#bg)"/><rect width="1000" height="180" fill="url(#grid)"/>
<rect x="478" y="30" width="44" height="3" fill="#f2b35e"/>
<text x="500" y="72" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7ff">Thanks for stopping by</text>
<text x="500" y="102" text-anchor="middle" font-size="16" fill="#9fb3d1">Let's build something reliable together.</text>
<path class="a" d="M0 144 Q125 130 250 144 T500 144 T750 144 T1000 144 T1250 144 T1500 144 T1750 144 T2000 144 V180 H0 Z" fill="#35e0c2" fill-opacity=".10"/>
<path class="b" d="M0 158 Q125 148 250 158 T500 158 T750 158 T1000 158 T1250 158 T1500 158 T1750 158 T2000 158 V180 H0 Z" fill="#35e0c2" fill-opacity=".16"/>
</g>
</svg>