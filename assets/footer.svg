<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Thanks for stopping by. Let's build something together." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#171245"/><stop offset="1" stop-color="#0c3d48"/></linearGradient>
<clipPath id="c"><rect width="1000" height="180" rx="22"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.w1{animation:s 14s linear infinite} .w2{animation:s 9s linear infinite} .w3{animation:s 6s linear infinite}
@keyframes s{to{transform:translateX(-500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="1000" height="180" fill="url(#bg)"/>
<circle class="tw" style="animation-delay:-0s" cx="90" cy="30" r="2" fill="#fff"/><circle class="tw" style="animation-delay:-1s" cx="240" cy="60" r="1.6" fill="#fff"/><circle class="tw" style="animation-delay:-2s" cx="420" cy="24" r="1.8" fill="#fff"/><circle class="tw" style="animation-delay:-0.5s" cx="610" cy="50" r="1.6" fill="#fff"/><circle class="tw" style="animation-delay:-1.6s" cx="790" cy="28" r="2" fill="#fff"/><circle class="tw" style="animation-delay:-2.4s" cx="930" cy="64" r="1.8" fill="#fff"/>
<text x="500" y="66" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">Thanks for stopping by</text>
<text x="500" y="98" text-anchor="middle" font-size="17" fill="#cfd8ff">Got a PCB, FPGA or robot idea? Let's build it together.</text>
<path class="w1" d="M0 138 Q125 112 250 138 T500 138 T750 138 T1000 138 T1250 138 T1500 138 T1750 138 T2000 138 V180 H0 Z" fill="#9b8cff" fill-opacity=".28"/>
<path class="w2" d="M0 150 Q125 128 250 150 T500 150 T750 150 T1000 150 T1250 150 T1500 150 T1750 150 T2000 150 V180 H0 Z" fill="#00f5d4" fill-opacity=".25"/>
<path class="w3" d="M0 162 Q125 146 250 162 T500 162 T750 162 T1000 162 T1250 162 T1500 162 T1750 162 T2000 162 V180 H0 Z" fill="#ffb86b" fill-opacity=".3"/>
</g>
</svg>